    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #1680c4, #ff1717);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        table {
            border-collapse: collapse;
            width: 750px;
            height: 750px;
            table-layout: fixed;
            background: white;
        }

        td {
            border: 1px solid black;
            padding: 0;
        }

        /* =====================
           FOUR HOME AREAS
           ===================== */

        .green-home {
             background-color: #008000;
        }

        .yellow-home {
                   background-color: #63e716;
        }

        .red-home {
           background-color: #ff0000;
        }

        .blue-home {
                  background-color: #0874c9;
                
        }

        /* =====================
           COLORED PATHS
           ===================== */

        /* Green path */
        .green {
            background: #008000;
        }

        /* Yellow path */
        .yellow {
            background: #ffdf32;
        }

        /* Red path */
        .red {
            background: #ff0808;
        }

        /* Blue path */
        .blue {
            background: #0874c9;
        }

        /* Center */
        .center {
            background: conic-gradient(
                #ff0000,
                #ff0000 25%,
                #0874c9 25%,
                #0874c9 50%,
                #ffdf32 50%,
                #ffdf32 75%,
                #008000 75%
            );
        }  
        </style>                                            
</head>
